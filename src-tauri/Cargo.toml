[package]
name = "tokenguard-desktop"
version = "0.2.0-beta.7"
description = "Local LLM gateway — track every token, nothing leaves your machine."
authors = ["QQSHI13"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tokenguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
keyring = { version = "4.1", features = ["windows-native-keyring-store", "apple-native-keyring-store", "dbus-secret-service-keyring-store"] }
hostname = "0.4"
whoami = "2.1"
sha2 = "0.11"
hex = "0.4"
local-ip-address = "0.6"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
dialoguer = { version = "0.12", default-features = false }
rand = "0.8"
anyhow = "1"
semver = "1"

[[bin]]
name = "tokenguard-desktop"
path = "src/main.rs"

[[bin]]
name = "tokenguard"
path = "src/bin/cli.rs"

[features]
default = ["gui", "custom-protocol"]
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-autostart",
    "tauri/tray-icon",
    "tauri/image-png",
]
custom-protocol = ["tauri/custom-protocol"]
